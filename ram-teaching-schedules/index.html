<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaM teaching schedules</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Teaching schedules of Robotics and Mechatronics staff at the University of Twente, 2026/2027.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500&display=swap">
<style>
/* Layout: sticky filter bar above a chronological activity list grouped by month; left accent marks the viewer's own teaching */
:root{
  --bg:#f7f6f2; --surface:#ffffff; --surface-2:#f0efe9; --text:#242320; --text-2:#6b6a63; --text-3:#9b9a91;
  --border:#e3e1d8; --border-strong:#cfcdc0; --accent:#1d6e5c; --accent-bg:#e1f1eb; --accent-text:#0f4b3d;
  --mine-bg:#fbf6e9; --mine-border:#c9a227; --mine-text:#6b5308;
  --chip:#edeae0; --danger:#b3261e;
  --ac-edu:#e4f5f6; --ac-edu-text:#1d3a3c; --ac-exam:#0aa0c8; --ac-hol:#35ae99; --ac-special:#999a1e; --ac-open:#f48fa0;
  --ac-resit:#c0bf74; --ac-msc:#ae80d6; --ac-self:#fbe21d; --ac-line:#3a3936; --ac-weekend:#ffffff;
  --font-display:'Space Grotesk',Inter,system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1c1b18; --surface:#242320; --surface-2:#2b2a26; --text:#efede6; --text-2:#b3b1a6; --text-3:#827f73;
    --border:#39372f; --border-strong:#4a473b; --accent:#5fc4a8; --accent-bg:#1d332d; --accent-text:#9fe3cc;
    --mine-bg:#332b14; --mine-border:#c9a227; --mine-text:#e8cf72;
    --chip:#302e27; --danger:#ff8a80;
    --ac-edu:#183a3d; --ac-edu-text:#d3eced; --ac-line:#5e5c53; --ac-weekend:#242320;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1c1b18; --surface:#242320; --surface-2:#2b2a26; --text:#efede6; --text-2:#b3b1a6; --text-3:#827f73;
  --border:#39372f; --border-strong:#4a473b; --accent:#5fc4a8; --accent-bg:#1d332d; --accent-text:#9fe3cc;
  --mine-bg:#332b14; --mine-border:#c9a227; --mine-text:#e8cf72;
  --chip:#302e27; --danger:#ff8a80;
  --ac-edu:#183a3d; --ac-edu-text:#d3eced; --ac-line:#5e5c53; --ac-weekend:#242320;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
.wrap{max-width:860px;margin:0 auto;padding-block:1.5rem 4rem;}
.wrap.wide{max-width:1320px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;text-wrap:balance;margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.page{display:flex;flex-direction:column;gap:.25rem;margin-bottom:1.25rem}
header.page h1{font-size:22px}
header.page p{margin:0;color:var(--text-2);font-size:14px}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:.75rem;margin-bottom:.5rem;
  border-bottom:0.5px solid var(--border);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.toolbar input[type=search]{flex:1;min-width:140px;height:36px;border-radius:8px;border:0.5px solid var(--border-strong);
  background:var(--surface);color:var(--text);padding:0 .75rem;font-size:14px}
.toolbar button.today{height:36px;border-radius:8px;border:0.5px solid var(--border-strong);background:var(--surface);
  color:var(--text);font-size:13px;padding:0 .75rem;cursor:pointer}
.toolbar button.today:hover{background:var(--surface-2)}
.legend{display:flex;gap:1rem;font-size:12px;color:var(--text-2);align-items:center;flex-wrap:wrap}
.legend .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.swatch.mine{background:var(--mine-border)}
.swatch.other{background:var(--text-3)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:1.5rem}
.filter-card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px}
.filter-card .fh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.filter-card h3{font-size:13px;color:var(--text)}
.filter-card .sel{font-size:11px;color:var(--accent);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline}
.filter-card label{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;color:var(--text-2);cursor:pointer}
.filter-card label.mine-row{color:var(--mine-text);font-weight:500;cursor:default}
.filter-card input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.filter-card label.mine-row input{visibility:hidden}
main{display:flex;flex-direction:column;gap:1.75rem}
.month{display:flex;flex-direction:column;gap:.6rem}
.month h2{font-size:15px;color:var(--text-2);font-weight:500;letter-spacing:.02em;position:sticky;top:var(--tb,61px);
  background:var(--bg);padding-block:.25rem;z-index:4}
.day{display:flex;flex-direction:column;gap:.4rem;scroll-margin-top:calc(var(--tb,61px) + 36px)}
.week-sep{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:11px;letter-spacing:.04em;margin:.3rem 0 -.1rem}
.week-sep::before,.week-sep::after{content:"";flex:1;height:0.5px;background:var(--border-strong)}
.view-switch{display:inline-flex;height:36px;border:0.5px solid var(--border-strong);border-radius:8px;overflow:hidden}
.view-switch button{border:none;background:var(--surface);color:var(--text-2);font-size:13px;padding:0 .75rem;cursor:pointer;font-family:inherit}
.view-switch button+button{border-left:0.5px solid var(--border-strong)}
.view-switch button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-text);font-weight:500}
.view-switch button:focus-visible,.toolbar button.today:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cal{border:0.5px solid var(--border);border-radius:12px;background:var(--surface);overflow:clip}
.cal-row{display:grid;grid-template-columns:64px repeat(var(--cols),minmax(0,1fr))}
.cal-head{position:sticky;top:var(--tb,61px);z-index:3;background:var(--surface-2);border-bottom:0.5px solid var(--border-strong);font-size:12px;color:var(--text-2);font-weight:500}
.cal-head>div{padding:6px 8px}
.cal-month{padding:12px 10px 6px;font-family:var(--font-display);font-size:14px;color:var(--text-2);font-weight:500;background:var(--bg);border-top:0.5px solid var(--border)}
.cal-week{border-top:0.5px solid var(--border);scroll-margin-top:calc(var(--tb,61px) + 34px)}
.cal-wk{padding:6px 8px;font-size:11px;color:var(--text-3);border-right:0.5px solid var(--border);display:flex;flex-direction:column;gap:1px}
.cal-wk b{color:var(--text-2);font-weight:500;font-size:12px}
.cal-day{padding:4px;min-height:40px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-day+.cal-day{border-left:0.5px solid var(--border)}
.cal-day.today{background:var(--accent-bg)}
.cal-day .dnum{font-size:11px;color:var(--text-3);padding:0 2px;font-variant-numeric:tabular-nums}
.cal-day.today .dnum{color:var(--accent-text);font-weight:500}
.chip{font:inherit;font-size:11px;line-height:1.3;padding:3px 5px;border-radius:5px;background:var(--surface-2);border:0.5px solid var(--border);min-width:0;overflow-wrap:break-word;hyphens:auto;display:flex;flex-direction:column;text-align:left;color:var(--text);cursor:pointer;width:100%}
.chip:hover{border-color:var(--text-3)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip.mine:hover{border-color:#a3820f}
.chip.compact{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;padding:2px 4px;background:var(--surface)}
.chip.compact.mine{background:var(--mine-bg)}
.chip.compact .ct{margin-right:3px}
.chip.compact .cr{color:var(--text-2)}
.filter-card .abbr{font-size:11px;color:var(--text-3);margin-left:2px}
.acell .slab-sub{font-size:11px;line-height:1.15;text-align:center;color:#fff;margin-top:-1px}
.act{scroll-margin-top:calc(var(--tb,61px) + 40px);transition:outline-color .3s}
.act.flash{outline:2px solid var(--accent);outline-offset:2px}
.tip{position:fixed;z-index:20;max-width:300px;background:var(--surface);color:var(--text);border:0.5px solid var(--border-strong);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.14);pointer-events:none}
.tip b{font-weight:500;font-size:13px;display:block;margin-bottom:2px}
.tip .tl{color:var(--text-2)}
.tip .th{margin-top:6px;color:var(--text-3);font-size:11px}
.acad-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-2);align-items:center}
.acad-legend .sw{display:inline-block;width:14px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px;border:0.5px solid var(--ac-line)}
.acad-legend a{color:var(--accent-text)}
.acad-block{display:flex;flex-direction:column;gap:6px;scroll-margin-top:calc(var(--tb,61px) + 12px)}
.acad-scroll{overflow-x:auto}
table.acad{width:100%;table-layout:fixed;border-collapse:collapse;background:var(--ac-weekend);font-variant-numeric:tabular-nums}
table.acad th,table.acad td{border:1px solid var(--ac-line);padding:0}
table.acad col.lab{width:92px}
table.acad thead th.qtitle{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--text-3);text-align:center;padding:6px;letter-spacing:.02em}
table.acad tbody th,table.acad thead th.rl{font-weight:400;font-size:12px;color:var(--text);text-align:left;padding:6px 8px;vertical-align:top;background:var(--ac-weekend)}
table.acad td.wn{font-size:22px;color:var(--text-3);text-align:center;padding:4px 2px}
table.acad td.qw{font-size:13px;color:var(--text);text-align:center;padding:6px 2px}
table.acad td.mo{font-size:12px;color:var(--text);text-align:center;padding:6px 2px;line-height:1.2}
table.acad tr.mon>*{border-top-width:2.5px}
table.acad tr.fri>*{border-bottom-width:2.5px}
.acell{display:flex;flex-direction:column;gap:2px;min-height:58px;padding:3px}
.acell .slab{font-size:11px;font-weight:500;line-height:1.15;text-align:center;color:#fff}
.acell .adn{margin-top:auto;align-self:flex-end;font-size:11px;color:var(--ac-edu-text);padding:0 1px}
td.k-edu{background:var(--ac-edu)}
td.k-exam{background:linear-gradient(90deg,var(--ac-edu) 50%,var(--ac-exam) 50%)}
td.k-hol{background:var(--ac-hol)}
td.k-special{background:var(--ac-special)}
td.k-open{background:var(--ac-open)}
td.k-rs{background:linear-gradient(90deg,var(--ac-resit) 50%,var(--ac-self) 50%)}
td.k-rm{background:linear-gradient(90deg,var(--ac-resit) 50%,var(--ac-msc) 50%)}
td.k-exam .adn,td.k-hol .adn,td.k-special .adn,td.k-open .adn,td.k-rm .adn{color:#fff}
td.k-rs .adn{color:#3a3500}
td.we .acell{min-height:30px}
td.we .adn{align-self:center;color:var(--text-2);font-size:11px}
td.we.k-open .adn{color:#fff}
td.today{box-shadow:inset 0 0 0 2.5px var(--accent)}
.chip.mine{background:var(--mine-bg);border-color:var(--mine-border)}
.chip .ct{color:var(--text-2);font-variant-numeric:tabular-nums}
.chip .cn{color:var(--text);font-weight:500}
.chip .cm{color:var(--text-2)}
.chip .cm a{color:var(--accent-text);text-decoration:none}
.chip .cm a:hover{text-decoration:underline}
@media (max-width:560px){
  .cal-scroll{overflow-x:auto}
  .cal{min-width:520px}
  .cal-head{position:static}
}
.day-label{font-size:12px;color:var(--text-3);display:flex;gap:.5rem;align-items:baseline}
.day-label .dow{color:var(--text-2);font-weight:500}
.day-label.today .dow{color:var(--accent-text)}
.day-label.today{position:relative}
.day-label.today::before{content:"";position:absolute;left:-10px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.act{display:grid;grid-template-columns:72px 1fr;gap:10px;background:var(--surface);border:0.5px solid var(--border);
  border-radius:10px;padding:9px 12px;font-size:13px;min-width:0}
.act.mine{border-left:3px solid var(--mine-border);background:var(--mine-bg)}
.act .time{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.act .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.act .top-row{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.act .course{font-weight:500;color:var(--text)}
.act .comp{color:var(--text-2);font-size:12px}
.act .badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--text-2);white-space:nowrap}
.act .mine-tag{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--mine-border);color:#2b2200;font-weight:500}
.act .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-2)}
.act .meta a{color:var(--accent-text);text-decoration:none}
.act .meta a:hover{text-decoration:underline}
.act .note{font-size:12px;color:var(--text-3);font-style:italic}
.empty{color:var(--text-3);font-size:13px;padding:2rem 0;text-align:center}
.gate{padding-block:14vh 4rem}
.gate-card{max-width:400px;margin:0 auto;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.gate-card h1{font-size:20px}
.gate-card p{margin:0;color:var(--text-2);font-size:14px}
.gate-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gate-row label{font-size:13px;color:var(--text-2);width:100%}
.gate canvas{border-radius:6px;border:0.5px solid var(--border);background:var(--surface-2)}
.gate input{height:40px;width:100px;font-size:18px;letter-spacing:.2em;text-align:center;border-radius:8px;border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text);font-variant-numeric:tabular-nums;font-family:inherit}
.gate button.go{height:40px;padding:0 16px;border-radius:8px;border:none;background:var(--accent);color:var(--surface);font:inherit;font-weight:500;cursor:pointer}
.gate input:focus-visible,.gate button:focus-visible,.person-pick select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gate-err{color:var(--danger);font-size:13px;margin:0}
.gate-new{align-self:flex-start;background:none;border:none;color:var(--accent-text);text-decoration:underline;font:inherit;font-size:12px;cursor:pointer;padding:0}
.person-pick{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--text-2);flex-wrap:wrap}
.person-pick select{height:36px;border-radius:8px;border:0.5px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-size:14px;padding:0 8px;max-width:100%}
.mod-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:480px){
  .act{grid-template-columns:56px 1fr}
  header.page h1{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap" id="wrap" lang="en">
<h2 class="sr-only">Teaching schedules of Robotics and Mechatronics staff, selectable per staff member</h2>
<header class="page">
  <h1>RaM teaching schedules</h1>
  <p id="subtitle">Academic year 2026/2027 &middot; Robotics and Mechatronics, University of Twente &middot; updated 19 Nov 2026</p>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Search course, room or person" aria-label="Search activities">
  <div class="view-switch" role="group" aria-label="View">
    <button type="button" id="viewAcad" aria-pressed="true">Year</button>
    <button type="button" id="viewCal" aria-pressed="false">Month</button>
    <button type="button" id="viewList" aria-pressed="false">List</button>
  </div>
  <button class="today" id="jumpToday">Jump to today</button>
  <div class="legend">
    <span><span class="swatch mine"></span><span id="legendMine">You're teaching</span></span>
    <span><span class="swatch other"></span>Other course in module</span>
  </div>
</div>

<div class="filters" id="filters"></div>

<main id="main"></main>
<p class="empty" id="emptyMsg" hidden>No activities match your filters.</p>
</div>
<div class="tip" id="tip" hidden></div>

  const abbr = a => ABBR[a.code] || a.course;

  }

    setPerson(pi);
  }

  function storageKey(code){ return "te_course_"+code; }

    let v = false;
    try {
      const raw = localStorage.getItem(storageKey(c.code));
      if (raw !== null) v = raw === "1";
    } catch(e){}
    if (v) state.checked.add(c.code);
  }));

  function abbrHint(c){
    const ab = ABBR[c.code];
    return ab && ab !== c.course ? ' <span class="abbr">' + ab.replace('&','&amp;') + '</span>' : '';
  }
  const filtersEl = document.getElementById('filters');
  const youLabel = () => GROUP ? '(teaching)' : '(you)';
  function buildFilters(){
  filtersEl.innerHTML = '';
  visibleModules.clear();
  modules.forEach(m => {
    if (GROUP && !m.courses.some(c => c.mine)) return;
    visibleModules.add(m.code);
    const card = document.createElement('div');
    card.className = 'filter-card';
    const others = m.courses.filter(c => !c.mine);
    const mine = m.courses.filter(c => c.mine);
    const checkboxes = [];
    const fh = document.createElement('div');
    fh.className = 'fh';
    const h3 = document.createElement('h3');
    h3.textContent = m.label;
    fh.appendChild(h3);
    if (others.length){
      const selBtn = document.createElement('button');
      selBtn.className = 'sel';
      selBtn.type = 'button';
      selBtn.textContent = 'toggle all';
      selBtn.addEventListener('click', () => {
        const allOn = others.every(c => state.checked.has(c.code));
        others.forEach(c => {
          if (allOn) state.checked.delete(c.code); else state.checked.add(c.code);
          try { localStorage.setItem(storageKey(c.code), allOn ? "0" : "1"); } catch(e){}
        });
        checkboxes.forEach(cb => { cb.checked = !allOn; });
        render();
      });
      fh.appendChild(selBtn);
    }
    card.appendChild(fh);
    mine.forEach(c => {
      const lab = document.createElement('label');
      lab.className = 'mine-row';
      lab.innerHTML = '<input type="checkbox" checked disabled> ' + c.course + abbrHint(c) + ' <span class="mod-label">' + youLabel() + '</span>';
      card.appendChild(lab);
    });
    others.forEach(c => {
      const lab = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = state.checked.has(c.code);
      cb.addEventListener('change', () => {
        if (cb.checked) state.checked.add(c.code); else state.checked.delete(c.code);
        try { localStorage.setItem(storageKey(c.code), cb.checked ? "1" : "0"); } catch(e){}
        render();
      });
      checkboxes.push(cb);
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(' ' + c.course));
      if (abbrHint(c)) lab.insertAdjacentHTML('beforeend', abbrHint(c));
      card.appendChild(lab);
    });
    filtersEl.appendChild(card);
  });
  if (GROUP) buildOtherCard();
  }
  function buildOtherCard(){
    const inMod = new Set();
    modules.forEach(m => m.courses.forEach(c => inMod.add(c.code)));
    const seen = new Map();
    acts.forEach(a => { if (a.mine && !inMod.has(a.code) && !seen.has(a.code)) seen.set(a.code, a); });
    if (!seen.size) return;
    const card = document.createElement('div');
    card.className = 'filter-card';
    card.innerHTML = '<div class="fh"><h3>Other courses</h3></div>';
    [...seen.values()].sort((x, y) => x.course.localeCompare(y.course)).forEach(a => {
      const lab = document.createElement('label');
      lab.className = 'mine-row';
      lab.innerHTML = '<input type="checkbox" checked disabled> ' + esc(a.course) + abbrHint(a) + ' <span class="mod-label">(teaching)</span>';
      card.appendChild(lab);
    });
    filtersEl.appendChild(card);
  }
  buildFilters();

  const todayISO = nowD.getFullYear() + '-' + String(nowD.getMonth()+1).padStart(2,'0') + '-' + String(nowD.getDate()).padStart(2,'0');

  function fmtDay(iso){
    const d = new Date(iso+"T00:00:00");
    return DOW[d.getDay()] + " " + d.getDate();
  }
  function fmtMonth(iso){
    const d = new Date(iso+"T00:00:00");
    return MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  function isoWeek(iso){
    const d = new Date(iso+"T00:00:00Z");
    const day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day + 3);
    const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    const firstDay = (firstThursday.getUTCDay() + 6) % 7;
    firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDay + 3);
    return 1 + Math.round((d - firstThursday) / (7 * 86400000));
  }

  function matchesQuery(a, q){
    if (!q) return true;
    const hay = [a.course, a.component, a.type, a.docent, a.note, ...a.rooms.map(r=>r.room)].join(" ").toLowerCase();
    return hay.includes(q);
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  function roomsHtml(a){
    return a.rooms.map(r => r.link ? '<a href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.room)+'</a>' : esc(r.room)).join(', ');
  }
  function addDays(iso, n){
    const d = new Date(iso+"T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0,10);
  }
  function mondayOf(iso){
    const d = new Date(iso+"T00:00:00Z");
    return addDays(iso, -((d.getUTCDay() + 6) % 7));
  }
  const MON_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    render();
  }

  const moduleLabel = {};
  modules.forEach(m => { moduleLabel[m.code] = m.label; });
  const tip = document.getElementById('tip');
  function longDate(iso){
    const d = new Date(iso+"T00:00:00");
    return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON_SHORT[d.getMonth()] + ' ' + d.getFullYear();
  }
  function showTip(el, a){
    const lines = [];
    if (a.component) lines.push(esc(a.component));
    lines.push(esc(a.type) + (a.mine ? ' &middot; ' + (GROUP ? esc(person.name) + ' teaching' : 'you\'re teaching') : ''));
    lines.push(longDate(a.date) + ', ' + a.start + '–' + a.end);
    if (a.rooms.length) lines.push(esc(a.rooms.map(r => r.room).join(', ')));
    if (a.docent) lines.push(esc(a.docent.replace(/\s+/g,' ')));
    if (a.note) lines.push('<i>' + esc(a.note) + '</i>');
    lines.push(esc(a.modules.map(m => moduleLabel[m] || m).join(', ')));
    tip.innerHTML = '<b>' + esc(a.course) + (a.code ? ' <span class="tl">(' + a.code + ')</span>' : '') + '</b>' +
      lines.map(l => '<div class="tl">' + l + '</div>').join('') +
      '<div class="th">Click to open in list view</div>';
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const left = Math.min(r.left, window.innerWidth - w - 8);
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip(){ tip.hidden = true; }
  window.addEventListener('scroll', hideTip, {passive:true});

  function goTo(i){
    hideTip();
    setView('list');
    const el = document.getElementById('a-' + i);
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'center'});
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 2500);
  }
  function shortRoom(a){
    if (!a.rooms.length) return '';
    const r = a.rooms[0].room;
    let t = r;
    if (/no room required/i.test(r)) t = 'no room';
    else if (/request/i.test(r)) t = 'room TBD';
    else t = r.replace(/\s*\(\d+p\)$/, '');
    return a.rooms.length > 1 ? t + ' +' + (a.rooms.length - 1) : t;
  }
  function makeChip(a, compact){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (compact ? ' compact' : '') + (a.mine ? ' mine' : '');
    if (compact){
      b.innerHTML = '<span class="ct">' + a.start + '</span><span class="cn">' + esc(abbr(a)) + '</span>' +
        (shortRoom(a) ? '<br><span class="cr">' + esc(shortRoom(a)) + '</span>' : '');
    } else {
      const rooms = a.rooms.map(r => r.room).join(', ');
      b.innerHTML = '<span class="ct">' + a.start + '–' + a.end + '</span>' +
        '<span class="cn">' + esc(a.course) + '</span>' +
        '<span class="cm">' + esc(a.type) + (rooms ? ' · ' + esc(rooms) : '') + '</span>';
    }
    b.setAttribute('aria-label', a.course + ', ' + a.type + ', ' + longDate(a.date) + ' ' + a.start + '–' + a.end + '. Open in list view');
    b.addEventListener('mouseenter', () => showTip(b, a));
    b.addEventListener('focus', () => showTip(b, a));
    b.addEventListener('mouseleave', hideTip);
    b.addEventListener('blur', hideTip);
    b.addEventListener('click', () => goTo(a.idx));
    return b;
  }
  const toolbarEl = document.querySelector('.toolbar');
  function syncToolbar(){ document.documentElement.style.setProperty('--tb', toolbarEl.offsetHeight + 'px'); }
  syncToolbar();
  try { new ResizeObserver(syncToolbar).observe(toolbarEl); } catch(e){ window.addEventListener('resize', syncToolbar); }
  Object.keys(viewBtns).forEach(k => viewBtns[k].addEventListener('click', () => setView(k)));

  function render(){
    const main = document.getElementById('main');
    main.innerHTML = '';
    hideTip();
    Object.keys(viewBtns).forEach(k => viewBtns[k].setAttribute('aria-pressed', state.view === k));
    document.getElementById('wrap').classList.toggle('wide', state.view === 'acad');
    const visible = acts.filter(a => (a.mine || (state.checked.has(a.code) && a.modules.some(m => visibleModules.has(m)))) && matchesQuery(a, state.query));
    if (state.view === 'acad'){
      document.getElementById('emptyMsg').hidden = true;
      renderAcademic(main, visible);
      return;
    }
    document.getElementById('emptyMsg').hidden = visible.length > 0;
    if (!visible.length) return;
    if (state.view === 'cal') renderCalendar(main, visible); else renderList(main, visible);
  }

  function renderCalendar(main, visible){
    const byDate = {};
    visible.forEach(a => { (byDate[a.date] = byDate[a.date] || []).push(a); });
    const hasWeekend = visible.some(a => { const g = new Date(a.date+"T00:00:00Z").getUTCDay(); return g === 0 || g === 6; });
    const cols = hasWeekend ? 7 : 5;
    const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].slice(0, cols);

    const scroll = document.createElement('div');
    scroll.className = 'cal-scroll';
    const cal = document.createElement('div');
    cal.className = 'cal';
    cal.style.setProperty('--cols', cols);
    const headHtml = '<div>Week</div>' + dayNames.map(n => '<div>' + n + '</div>').join('');

    const first = mondayOf(visible[0].date);
    const last = mondayOf(visible[visible.length - 1].date);
    let prevMonth = null;
    for (let wkStart = first; wkStart <= last; wkStart = addDays(wkStart, 7)){
      const mKey = addDays(wkStart, 3).slice(0,7);
      if (mKey !== prevMonth){
        prevMonth = mKey;
        const mh = document.createElement('div');
        mh.className = 'cal-month';
        mh.textContent = fmtMonth(mKey + '-01');
        cal.appendChild(mh);
        const head = document.createElement('div');
        head.className = 'cal-row cal-head';
        head.innerHTML = headHtml;
        cal.appendChild(head);
      }
      const row = document.createElement('div');
      row.className = 'cal-row cal-week';
      row.id = 'w-' + wkStart;
      const s = new Date(wkStart+"T00:00:00Z");
      row.innerHTML = '<div class="cal-wk"><b>W' + isoWeek(wkStart) + '</b><span>' + s.getUTCDate() + ' ' + MON_SHORT[s.getUTCMonth()] + '</span></div>';
      for (let i = 0; i < cols; i++){
        const iso = addDays(wkStart, i);
        const d = new Date(iso+"T00:00:00Z");
        const cell = document.createElement('div');
        cell.className = 'cal-day' + (iso === todayISO ? ' today' : '');
        const dn = d.getUTCDate();
        cell.innerHTML = '<span class="dnum">' + dn + (dn === 1 ? ' ' + MON_SHORT[d.getUTCMonth()] : '') + '</span>';
        (byDate[iso] || []).forEach(a => cell.appendChild(makeChip(a, false)));
        row.appendChild(cell);
      }
      cal.appendChild(row);
    }
    scroll.appendChild(cal);
    main.appendChild(scroll);
  }

  const PH = 'Public Holiday';
  const SPECIAL = {
    '2026-10-23': ['open','BSc Open Days','Bachelor open day: no lectures'],
    '2026-10-24': ['open','BSc Open Days','Bachelor open day'],
    '2026-11-19': ['open','MSc info sessions','Schedules of 2nd and 3rd year students cleared 15:30–18:00 for MSc information sessions'],
    '2026-12-25': ['hol',PH,'Christmas Day'],
    '2026-12-28': ['hol','Collective Closure','Collective closure'],
    '2026-12-29': ['hol','Collective Closure','Collective closure'],
    '2026-12-30': ['hol','Collective Closure','Collective closure'],
    '2026-12-31': ['hol','Collective Closure','Collective closure'],
    '2027-01-01': ['hol',PH,"New Year's Day"],
    '2027-02-01': ['special','Kick In','Winter Kick-In: education free for programmes where exchange and Master students join'],
    '2027-02-02': ['special','Kick In','Winter Kick-In; Tuesday 15:00–17:00 education free for all programmes'],
    '2027-03-18': ['open','MSc Open Days','Master open day: no lectures'],
    '2027-03-19': ['open','BSc Open Days','Bachelor open day: no lectures'],
    '2027-03-20': ['open','BSc Open Days','Bachelor open day'],
    '2027-03-26': ['hol',PH,'Good Friday'],
    '2027-03-29': ['hol',PH,'Easter Monday'],
    '2027-04-27': ['hol',PH,"King's Day"],
    '2027-05-05': ['hol',PH,'Liberation Day'],
    '2027-05-06': ['hol',PH,'Ascension Day'],
    '2027-05-07': ['hol','Collective Closure','Collective closure'],
    '2027-05-17': ['hol',PH,'Whit Monday']
  };
  const range = (p, a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(p + '-' + String(i).padStart(2,'0')); return r; };
  const ACAD = [
    { title:'Quartile 1', start:'2026-08-31', qw: range('1',1,10),
      months:['Sep','Sep','Sep','Sep','Sep/ Oct','Oct','Oct','Oct','Oct','Nov'], kinds:{8:'exam',9:'exam'} },
    { title:'Quartile 2', start:'2026-11-09', qw: [...range('2',1,6),'','',...range('2',7,10)],
      months:['Nov','Nov','Nov','Nov/ Dec','Dec','Dec','Dec','Dec/ Jan','Jan','Jan','Jan','Jan'], kinds:{6:'hol',7:'hol',10:'exam',11:'exam'}, breaks:{6:'Christmas break'} },
    { title:'Quartile 3', start:'2027-02-01', qw: [...range('3',1,3),'',...range('3',4,10)],
      months:['Feb','Feb','Feb','Feb','Mar','Mar','Mar','Mar','Mar/ Apr','Apr','Apr'], kinds:{3:'hol',9:'exam',10:'exam'}, breaks:{3:'Spring break'} },
    { title:'Quartile 4', start:'2027-04-19', qw: range('4',1,11),
      months:['Apr','Apr/ May','May','May','May','May','May/ Jun','Jun','Jun','Jun','Jun/ July'], kinds:{9:'exam',10:'exam'} },
    { title:'Summer', start:'2027-07-05', qw: ['','','','','','','',''],
      months:['Jul','Jul','Jul','Jul/ Aug','Aug','Aug','Aug','Aug'], kinds:{0:'rs',1:'rs',2:'rm',3:'hol',4:'hol',5:'hol',6:'hol',7:'hol'}, breaks:{3:'Summer holiday',4:'Summer holiday',5:'Summer holiday',6:'Summer holiday',7:'Summer holiday'} }
  ];
  const KIND_INFO = {
    edu:'Module education including tests / lectures',
    exam:'BSc: module education including tests. MSc: exams',
    hol:'Holidays',
    rs:'BSc: resits and self-study for finishing modules. MSc: self-study for resits',
    rm:'BSc: resits and self-study for finishing modules. MSc: resits 4th quartile'
  };
  const WEEKDAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  function renderAcademic(main, visible){
    const byDate = {};
    visible.forEach(a => { (byDate[a.date] = byDate[a.date] || []).push(a); });

    const legend = document.createElement('div');
    legend.className = 'acad-legend';
    const sw = (bg, label) => '<span><span class="sw" style="background:' + bg + '"></span>' + label + '</span>';
    legend.innerHTML = sw('var(--ac-edu)','Module education / lectures') + sw('var(--ac-exam)','Exams (MSc)') +
      sw('var(--ac-hol)','Holidays') + sw('var(--ac-special)','Special event, education free') +
      sw('var(--ac-open)','Open day / no lectures') + sw('var(--ac-resit)','Resits (BSc)') +
      sw('var(--ac-msc)','Resits MSc Q4') + sw('var(--ac-self)','Self-study for resits') +
      '<span>Source: <a href="https://www.utwente.nl/en/service-portal/educational-support/planning-schedules/academic-calendar-year-cycle-and-holidays" target="_blank" rel="noopener">UT academic calendar 2026–2027</a></span>';
    main.appendChild(legend);

    ACAD.forEach((blk, bi) => {
      const n = blk.qw.length;
      const block = document.createElement('section');
      block.className = 'acad-block';
      block.id = 'aq-' + bi;
      const scroll = document.createElement('div');
      scroll.className = 'acad-scroll';
      const t = document.createElement('table');
      t.className = 'acad';
      t.style.minWidth = (92 + n * 78) + 'px';
      const mondays = [];
      for (let w = 0; w < n; w++) mondays.push(addDays(blk.start, w * 7));
      let html = '<colgroup><col class="lab">' + '<col>'.repeat(n) + '</colgroup><thead>';
      html += '<tr><th class="rl"></th><th class="qtitle" colspan="' + n + '">' + blk.title + '</th></tr>';
      html += '<tr><th class="rl">Week number</th>' + mondays.map(m => '<td class="wn">' + isoWeek(m) + '</td>').join('') + '</tr>';
      html += '<tr><th class="rl">Quartile-week</th>' + blk.qw.map(q => '<td class="qw">' + q + '</td>').join('') + '</tr>';
      html += '<tr><th class="rl">Month</th>' + blk.months.map(m => '<td class="mo">' + m.replace('/ ','/<br>') + '</td>').join('') + '</tr>';
      html += '</thead><tbody></tbody>';
      t.innerHTML = html;
      const tbody = t.querySelector('tbody');
      for (let d = 0; d < 7; d++){
        const tr = document.createElement('tr');
        if (d === 0) tr.className = 'mon';
        if (d === 4) tr.className = 'fri';
        const th = document.createElement('th');
        th.textContent = WEEKDAYS[d];
        tr.appendChild(th);
        for (let w = 0; w < n; w++){
          const iso = addDays(mondays[w], d);
          const sp = SPECIAL[iso];
          const weekend = d >= 5;
          let kind = weekend ? '' : (blk.kinds[w] || 'edu');
          if (sp) kind = sp[0];
          const td = document.createElement('td');
          td.id = 'ac-' + iso;
          td.className = (kind ? 'k-' + kind : '') + (weekend ? ' we' : '') + (iso === todayISO ? ' today' : '');
          const info = sp ? (sp[1] === PH ? 'Public holiday, ' + sp[2] : sp[2]) : (!weekend && blk.breaks && blk.breaks[w]) ? blk.breaks[w] : (kind ? KIND_INFO[kind] : '');
          td.title = longDate(iso) + (info ? ': ' + info : '');
          const cell = document.createElement('div');
          cell.className = 'acell';
          if (sp && sp[1]){
            const lab = document.createElement('span');
            lab.className = 'slab';
            lab.textContent = sp[1];
            cell.appendChild(lab);
            if (sp[1] === PH){
              const sub = document.createElement('span');
              sub.className = 'slab-sub';
              sub.textContent = sp[2];
              cell.appendChild(sub);
            }
          } else if (!weekend && d === 0 && blk.breaks && blk.breaks[w]){
            const lab = document.createElement('span');
            lab.className = 'slab';
            lab.textContent = blk.breaks[w];
            cell.appendChild(lab);
          }
          (byDate[iso] || []).forEach(a => cell.appendChild(makeChip(a, true)));
          const dn = document.createElement('span');
          dn.className = 'adn';
          const dd = new Date(iso+"T00:00:00Z");
          dn.textContent = weekend ? String(dd.getUTCDate()).padStart(2,'0') + '-' + String(dd.getUTCMonth()+1).padStart(2,'0') : dd.getUTCDate();
          cell.appendChild(dn);
          td.appendChild(cell);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      scroll.appendChild(t);
      block.appendChild(scroll);
      main.appendChild(block);
    });
  }

  function renderList(main, visible){
    let curMonth = null, curDay = null, curWeek = null, monthEl = null, dayEl = null;
    visible.forEach(a => {
      const mKey = a.date.slice(0,7);
      if (mKey !== curMonth){
        curMonth = mKey;
        monthEl = document.createElement('div');
        monthEl.className = 'month';
        const h2 = document.createElement('h2');
        h2.textContent = fmtMonth(a.date);
        monthEl.appendChild(h2);
        main.appendChild(monthEl);
        curDay = null;
        curWeek = null;
      }
      const wk = isoWeek(a.date);
      if (wk !== curWeek){
        curWeek = wk;
        const sep = document.createElement('div');
        sep.className = 'week-sep';
        sep.textContent = 'Week ' + wk;
        monthEl.appendChild(sep);
      }
      if (a.date !== curDay){
        curDay = a.date;
        dayEl = document.createElement('div');
        dayEl.className = 'day';
        dayEl.id = 'd-' + a.date;
        const lbl = document.createElement('div');
        lbl.className = 'day-label' + (a.date === todayISO ? ' today' : '');
        lbl.innerHTML = '<span class="dow">' + fmtDay(a.date) + '</span>';
        dayEl.appendChild(lbl);
        monthEl.appendChild(dayEl);
      }
      const row = document.createElement('div');
      row.className = 'act' + (a.mine ? ' mine' : '');
      row.id = 'a-' + a.idx;
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = a.start + (a.end && a.end !== a.start ? '–' + a.end : '');
      row.appendChild(time);
      const body = document.createElement('div');
      body.className = 'body';
      const top = document.createElement('div');
      top.className = 'top-row';
      top.innerHTML = '<span class="course">' + a.course + '</span>' +
        (a.component ? '<span class="comp">' + a.component + '</span>' : '') +
        '<span class="badge">' + a.type + '</span>' +
        (a.mine ? '<span class="mine-tag">teaching</span>' : '');
      body.appendChild(top);
      const meta = document.createElement('div');
      meta.className = 'meta';
      const roomsHtml = a.rooms.map(r => r.link ? '<a href="'+r.link+'" target="_blank" rel="noopener">'+r.room+'</a>' : r.room).join(', ');
      meta.innerHTML = (roomsHtml ? '<span>' + roomsHtml + '</span>' : '') +
        (a.docent ? '<span>' + a.docent.replace(/\s+/g,' ') + '</span>' : '');
      body.appendChild(meta);
      if (a.note){
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = a.note;
        body.appendChild(note);
      }
      row.appendChild(body);
      dayEl.appendChild(row);
    });
  }

  document.getElementById('jumpToday').addEventListener('click', () => {
    let el;
    if (state.view === 'cal'){
      el = document.getElementById('w-' + mondayOf(todayISO));
    } else if (state.view === 'acad'){
      const cellEl = document.getElementById('ac-' + todayISO);
      el = cellEl ? cellEl.closest('.acad-block') : null;
    } else {
      el = Array.from(document.querySelectorAll('.day')).find(d => d.id.slice(2) >= todayISO);
    }
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });

  if (GROUP){
    const header = document.querySelector('header.page');
    const pick = document.createElement('div');
    pick.className = 'person-pick';
    pick.innerHTML = '<label for="personSel">Staff member</label>';
    const sel = document.createElement('select');
    sel.id = 'personSel';
    persons.forEach((p, i) => sel.add(new Option(p.name + ' (' + p.n + ')', i)));
    sel.value = String(persons.indexOf(person));
    pick.appendChild(sel);
    header.appendChild(pick);
    const legendMine = document.getElementById('legendMine');
    legendMine.textContent = person.name + ' teaching';
    sel.addEventListener('change', () => {
      setPerson(parseInt(sel.value, 10));
      try { localStorage.setItem('te_person', sel.value); } catch(e){}
      legendMine.textContent = person.name + ' teaching';
      buildFilters();
      render();
    });

    let unlocked = false;
    try { unlocked = localStorage.getItem('te_unlocked') === '1'; } catch(e){}
    if (!unlocked){
      const wrapEl = document.getElementById('wrap');
      wrapEl.hidden = true;
      const g = document.createElement('div');
      g.className = 'gate';
      g.innerHTML = '<div class="gate-card"><h1>RaM teaching schedules</h1>' +
        '<p>Enter the password: the 4-digit code shown in the image.</p>' +
        '<form class="gate-row" id="gateForm" novalidate><label for="gateCode">Password</label>' +
        '<canvas id="gateImg" width="120" height="44" role="img" aria-label="Image with the 4-digit code"></canvas>' +
        '<input id="gateCode" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="0000">' +
        '<button type="submit" class="go">Open</button></form>' +
        '<p class="gate-err" id="gateErr" hidden></p>' +
        '<button type="button" class="gate-new" id="gateNew">Show another code</button></div>';
      wrapEl.parentNode.insertBefore(g, wrapEl);
      let code = '';
      const cv = document.getElementById('gateImg');
      const FONT = '600 26px system-ui, "Segoe UI", Arial, sans-serif';
      function draw(){
        code = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
        paint();
      }
      function paint(){
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#f0efe9';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.strokeStyle = '#9b9a91';
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++){
          ctx.beginPath();
          ctx.moveTo(Math.random() * 120, Math.random() * 44);
          ctx.bezierCurveTo(Math.random() * 120, Math.random() * 44, Math.random() * 120, Math.random() * 44, Math.random() * 120, Math.random() * 44);
          ctx.stroke();
        }
        ctx.fillStyle = '#242320';
        ctx.font = FONT;
        ctx.textBaseline = 'middle';
        for (let i = 0; i < 4; i++){
          ctx.save();
          ctx.translate(18 + i * 26, 22 + (Math.random() * 6 - 3));
          ctx.rotate((Math.random() - 0.5) * 0.5);
          ctx.fillText(code[i], -7, 0);
          ctx.restore();
        }
      }
      draw();
      const input = document.getElementById('gateCode');
      const err = document.getElementById('gateErr');
      input.addEventListener('input', () => { err.hidden = true; });
      document.getElementById('gateNew').addEventListener('click', () => { draw(); input.value = ''; input.focus(); });
      document.getElementById('gateForm').addEventListener('submit', ev => {
        ev.preventDefault();
        const v = input.value.trim();
        if (!/^\d{4}$/.test(v)){
          err.textContent = 'Enter the 4 digits from the image.';
          err.hidden = false;
          return;
        }
        if (v !== code){
          err.textContent = "That doesn't match the image. Try the new code.";
          err.hidden = false;
          draw();
          input.value = '';
          input.focus();
          return;
        }
        try { localStorage.setItem('te_unlocked', '1'); } catch(e){}
        g.remove();
        wrapEl.hidden = false;
        syncToolbar();
        render();
      });
      input.focus();
    }
  }

  render();
})();
</script>
</body>
</html>
